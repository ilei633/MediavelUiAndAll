<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap');
        
        body {
            margin: 0; padding: 0; 
            font-family: 'Lato', sans-serif;
            color: #eee;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
        }

        .board {
            width: 800px; max-height: 80vh;
            background: rgba(15, 15, 20, 0.9);
            border: 2px solid #d4af37;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,0,0,1), inset 0 0 20px rgba(212,175,55,0.1);
            display: flex; flex-direction: column;
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(212,175,55,0.3);
            background: linear-gradient(180deg, rgba(212,175,55,0.15) 0%, transparent 100%);
        }

        .header h1 {
            margin: 0;
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 34px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(212,175,55,0.5);
        }

        .header p {
            margin: 5px 0 0 0;
            color: #aaa;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .table-container {
            overflow-y: auto;
            padding: 10px 20px 20px 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 4px;
            transition: 0.2s;
            align-items: center;
        }

        .row:hover {
            background: rgba(212,175,55,0.1);
            border-color: rgba(212,175,55,0.3);
        }

        .col { flex: 1; text-align: center; font-size: 16px; }
        .col.name { flex: 2; text-align: left; font-weight: bold; color: #fff; font-size: 17px; }
        
        .col.class-badge {
            color: #d4af37;
            font-family: 'Cinzel', serif;
            font-weight: bold;
        }
        
        .col.ping { color: #55ff55; font-family: monospace; font-size: 14px; }

        .row-header {
            background: transparent;
            border: none;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ffe066; }
    </style>
</head>
<body>
    <div class="board">
        <div class="header">
            <h1>Aetheria Realm</h1>
            <p id="player-count">0 Players Online</p>
        </div>
        <div class="table-container">
            <div class="row row-header">
                <div class="col name">Adventurer</div>
                <div class="col">Level</div>
                <div class="col">Class</div>
                <div class="col">Ping</div>
            </div>
            <div id="player-list"></div>
        </div>
    </div>

    <script>
        function updatePlayers(jsonData) {
            try {
                var players = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
                players.sort(function(a, b) { return (b.lvl || 0) - (a.lvl || 0); });
                
                var countEl = document.getElementById('player-count');
                if (countEl) countEl.innerText = players.length + " Player" + (players.length !== 1 ? "s" : "") + " Online";

                var html = '';
                for (var i = 0; i < players.length; i++) {
                    var p = players[i];
                    var ping = p.ping || 0;
                    var pingColor = ping < 50 ? '#55ff55' : (ping < 120 ? '#ffff55' : '#ff5555');
                    html += '<div class="row">' +
                        '<div class="col name">' + (p.name || "Unknown") + '</div>' +
                        '<div class="col" style="color: #ffe066; font-weight: bold;">' + (p.lvl || 1) + '</div>' +
                        '<div class="col class-badge">' + (p.cls || "None") + '</div>' +
                        '<div class="col ping" style="color: ' + pingColor + '">' + ping + ' ms</div>' +
                    '</div>';
                }
                var listEl = document.getElementById('player-list');
                if (listEl) listEl.innerHTML = html;
            } catch(e) {
                console.error("Scoreboard parse error:", e);
            }
        }
    </script>
</body>
</html>
