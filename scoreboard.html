<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap');
        
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Lato', sans-serif; overflow: hidden; }
        .container { 
            width: 70%; height: 80%; 
            background: linear-gradient(135deg, rgba(15, 15, 20, 0.95), rgba(5, 5, 10, 0.98)); 
            border: 2px solid #d4af37; border-radius: 4px; 
            box-shadow: 0 0 50px rgba(0,0,0,1), inset 0 0 30px rgba(212, 175, 55, 0.1); 
            display: flex; flex-direction: column; overflow: hidden; 
        }
        .header { 
            background: linear-gradient(90deg, rgba(30, 25, 20, 0.9), rgba(15, 15, 20, 0.9)); 
            padding: 20px; text-align: center; border-bottom: 2px solid #d4af37; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .header h1 { 
            margin: 0; color: #d4af37; font-family: 'Cinzel', serif; font-size: 34px; 
            letter-spacing: 3px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); font-weight: bold; 
        }
        
        .table-container { flex: 1; overflow-y: auto; padding: 20px; background: url('https://www.transparenttextures.com/patterns/black-scales.png'); }
        table { width: 100%; border-collapse: collapse; color: white; }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        th { 
            background: rgba(0,0,0,0.5); color: #d4af37; font-family: 'Cinzel', serif; 
            text-transform: uppercase; font-size: 16px; position: sticky; top: 0; letter-spacing: 1px;
        }
        tr { transition: 0.2s; }
        tr:nth-child(even) { background: rgba(0,0,0,0.2); }
        tr:hover { background: rgba(212, 175, 55, 0.15); transform: scale(1.01); box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        .ping { color: #55ff55; font-weight: bold; text-shadow: 0 0 5px rgba(85,255,85,0.3); }
        .level { color: #5555ff; font-weight: bold; text-shadow: 0 0 5px rgba(85,85,255,0.3); }
        .player-name { font-weight: bold; font-family: 'Cinzel', serif; letter-spacing: 1px; font-size: 18px; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.4); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(212, 175, 55, 0.8); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AETHERIA: ASCENSION</h1>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Player Name</th>
                        <th>Level</th>
                        <th>Class</th>
                        <th>Ping</th>
                    </tr>
                </thead>
                <tbody id="player-list">
                    <!-- Players inserted here -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        function updatePlayers(jsonData) {
            const players = JSON.parse(jsonData);
            let html = '';
            for(let p of players) {
                html += `
                    <tr>
                        <td class="player-name">${p.name}</td>
                        <td class="level">${p.lvl}</td>
                        <td style="color: #aaa;">${p.cls}</td>
                        <td class="ping">${p.ping} ms</td>
                    </tr>
                `;
            }
            document.getElementById('player-list').innerHTML = html;
        }
    </script>
</body>
</html>
