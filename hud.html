<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap');
        
        body { margin: 0; overflow: hidden; font-family: 'Lato', sans-serif; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }
        
        .hud-container {
            position: absolute; bottom: 30px; left: 30px;
            display: flex; align-items: flex-end; gap: 20px;
        }

        .avatar-frame {
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            background: rgba(10, 10, 15, 0.9);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(0,0,0,0.8);
            position: relative; display: flex; justify-content: center; align-items: center;
        }

        .level-badge {
            position: absolute; bottom: -10px;
            background: linear-gradient(135deg, #b8860b, #ffd700);
            color: #111; font-family: 'Cinzel', serif; font-weight: bold; font-size: 16px;
            padding: 3px 12px; border-radius: 10px; border: 1px solid #fff; text-shadow: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .bars-container {
            display: flex; flex-direction: column; gap: 8px; width: 350px; margin-bottom: 15px;
        }

        .info-panel {
            position: absolute; top: -45px; left: 0;
            display: flex; gap: 15px; font-family: 'Cinzel', serif; font-size: 18px; color: #d4af37; white-space: nowrap;
        }
        
        .currency { color: #ffaa00; font-weight: bold; }

        .bar-bg {
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px; height: 22px; position: relative; overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); backdrop-filter: blur(5px);
        }

        .health-fill { height: 100%; background: linear-gradient(90deg, #8b0000, #ff3333); width: 100%; transition: width 0.3s ease; box-shadow: 0 0 10px rgba(255,51,51,0.5); }
        .mana-fill { height: 100%; background: linear-gradient(90deg, #00008b, #3366ff); width: 100%; transition: width 0.3s ease; box-shadow: 0 0 10px rgba(51,102,255,0.5); }
        .exp-fill { height: 100%; background: linear-gradient(90deg, #b8860b, #ffd700); width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
        
        .bar-text { position: absolute; width: 100%; text-align: center; top: 1px; color: white; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="hud-container">
        <div class="avatar-frame">
            <span style="font-family: 'Cinzel', serif; color: #d4af37; font-size: 40px; text-shadow: none;">A</span>
            <div class="level-badge" id="hud-level">1</div>
        </div>
        <div class="bars-container">
            <div class="info-panel">
                <span id="hud-name">Aetherian</span> | 
                <span id="hud-class">Novice</span> | 
                <span class="currency">₳ <span id="hud-money">0</span></span>
            </div>
            
            <div class="bar-bg">
                <div class="health-fill" id="hp-fill"></div>
                <div class="bar-text" id="hp-text">100 / 100</div>
            </div>
            
            <div class="bar-bg">
                <div class="mana-fill" id="mp-fill"></div>
                <div class="bar-text" id="mp-text">100 / 100</div>
            </div>
            
            <div class="bar-bg" style="height: 6px; border-radius: 2px;">
                <div class="exp-fill" id="exp-fill"></div>
            </div>
        </div>
    </div>
    
    <script>
        function updateHUD(hp, maxHp, mana, maxMana, money, name, lvl, cls, exp, maxExp) {
            document.getElementById('hp-fill').style.width = Math.max(0, Math.min(100, (hp / maxHp) * 100)) + '%';
            document.getElementById('hp-text').innerText = hp + ' / ' + maxHp;
            
            document.getElementById('mp-fill').style.width = Math.max(0, Math.min(100, (mana / maxMana) * 100)) + '%';
            document.getElementById('mp-text').innerText = mana + ' / ' + maxMana;
            
            let expPct = (exp / maxExp) * 100;
            document.getElementById('exp-fill').style.width = Math.max(0, Math.min(100, expPct)) + '%';
            
            document.getElementById('hud-money').innerText = money;
            document.getElementById('hud-name').innerText = name;
            document.getElementById('hud-level').innerText = lvl;
            document.getElementById('hud-class').innerText = cls;
        }
    </script>
</body>
</html>
