<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Metamorphous&family=Rosarivo&display=swap');
        
        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: 'Rosarivo', serif;
            color: #ecf0f1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        
        .hud-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }

        .level-orb {
            width: 80px; height: 80px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b, #332200);
            border-radius: 50%;
            border: 3px solid #1a1a1a;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6), inset 0 0 20px rgba(255,255,255,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .level-orb span {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px #000, 0 0 10px rgba(0,0,0,0.5);
            line-height: 1;
        }

        .level-orb .lvl-text {
            font-size: 10px;
            letter-spacing: 2px;
            color: #ffe066;
            text-transform: uppercase;
        }

        .bars-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 10px;
            width: 350px;
        }

        .bar-bg {
            background: rgba(10, 10, 15, 0.85);
            border: 2px solid #3e3e3e;
            border-radius: 3px;
            height: 22px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .bar-bg::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 100%);
            pointer-events: none;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.3s ease-out;
            position: relative;
        }

        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 13px;
            font-family: 'Metamorphous', cursive;
            line-height: 22px;
            top: 0;
            left: 0;
            z-index: 1;
            letter-spacing: 1px;
        }

        .hp-fill { background: linear-gradient(90deg, #8b0000, #ff3333); box-shadow: 0 0 10px rgba(255,0,0,0.5); }
        .mana-fill { background: linear-gradient(90deg, #00008b, #3366ff); box-shadow: 0 0 10px rgba(0,100,255,0.5); }
        .exp-fill { background: linear-gradient(90deg, #4b0082, #9932cc); box-shadow: 0 0 10px rgba(150,0,255,0.5); }

        .player-info {
            position: absolute;
            bottom: 130px;
            left: 120px;
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .player-info .class-badge {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
            color: #fff;
        }

        .gold-container {
            position: absolute;
            top: 20px;
            right: 30px;
            background: rgba(10, 10, 15, 0.85);
            border: 2px solid #d4af37;
            border-radius: 4px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #ffd700;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .gold-icon {
            font-size: 28px;
            text-shadow: 0 0 10px rgba(255,215,0,0.8);
        }

    </style>
</head>
<body>
    <div class="player-info">
        <span id="p-name">Traveler</span>
        <span class="class-badge" id="p-class">None</span>
    </div>

    <div class="hud-container">
        <div class="level-orb">
            <span id="p-lvl">1</span>
            <div class="lvl-text">LEVEL</div>
        </div>
        
        <div class="bars-container">
            <div class="bar-bg">
                <div class="bar-fill hp-fill" id="hp-fill"></div>
                <div class="bar-text" id="hp-text">100 / 100</div>
            </div>
            <div class="bar-bg">
                <div class="bar-fill mana-fill" id="mana-fill"></div>
                <div class="bar-text" id="mana-text">50 / 50</div>
            </div>
            <div class="bar-bg" style="height: 12px; margin-top: 5px; border-color: #5a2e8c;">
                <div class="bar-fill exp-fill" id="exp-fill"></div>
            </div>
        </div>
    </div>

    <div class="gold-container">
        <span class="gold-icon">🪙</span>
        <span id="p-gold">0</span>
    </div>

    <script>
        function updateHUD(name, lvl, cls, hp, maxhp, mana, maxmana, exp, maxexp, gold) {
            document.getElementById('p-name').innerText = name;
            document.getElementById('p-lvl').innerText = lvl;
            document.getElementById('p-class').innerText = cls;
            document.getElementById('p-gold').innerText = new Intl.NumberFormat().format(gold);

            document.getElementById('hp-text').innerText = hp + ' / ' + maxhp;
            document.getElementById('hp-fill').style.width = Math.max(0, Math.min(100, (hp / maxhp) * 100)) + '%';

            document.getElementById('mana-text').innerText = mana + ' / ' + maxmana;
            document.getElementById('mana-fill').style.width = Math.max(0, Math.min(100, (mana / maxmana) * 100)) + '%';

            document.getElementById('exp-fill').style.width = Math.max(0, Math.min(100, (exp / maxexp) * 100)) + '%';
        }
    </script>
</body>
</html>
